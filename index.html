<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poké-Quiz - Examen de JavaScript</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="pokedex-container">
      <header>
        <h1>⚡ Poké-Quiz</h1>
        <div class="score">
          <span>Puntaje</span>
          <div class="score-container">
            <h2 id="score">0</h2>
            <select id="generationSelector" class="generation-select">
              <option value="1">Gen I (Kanto)</option>
              <option value="2">Gen II (Johto)</option>
              <option value="3">Gen III (Hoenn)</option>
              <option value="4">Gen IV (Sinnoh)</option>
              <option value="6">Gen VI (Kalos)</option>
            </select>
          </div>
        </div>
      </header>

      <section class="actions">
        <button type="button" id="btnNuevo" class="btn-action">
          <i class="fas fa-bolt"></i>
          Nuevo Pokémon
        </button>
        <button type="button" id="btnPista" class="btn-action">
          <i class="fas fa-lightbulb"></i>
          Pista
        </button>
        <button type="button" id="btnHistorial" class="btn-action">
          <i class="fas fa-history"></i>
          Historial
        </button>
      </section>

      <section class="quiz" id="quizSection">
        <h3>¿Quién es ese Pokémon?</h3>
        <div class="pokemon-view">
          <div class="sprite-wrapper">
            <img id="pokemonSprite" class="silueta" alt="Silueta del Pokémon" />
          </div>
          <form id="formQuiz" class="guess-form">
            <input
              type="text"
              id="guessInput"
              placeholder="Escribe el nombre..."
              autocomplete="off"
              required
            />
            <button type="submit" id="confirmarRespuesta">Confirmar</button>
          </form>
          <p id="feedback" class="feedback"></p>
        </div>
      </section>

      <!-- Modal Pista -->
      <div id="modalPista" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h3>💡 Pista del Pokémon</h3>
            <button type="button" class="cerrar-modal">&times;</button>
          </div>
          <div id="hintContent" class="hint-body"></div>
          <button type="button" class="btn-cerrar cerrar-modal">Cerrar</button>
        </div>
      </div>

      <!-- Modal Historial -->
      <div id="modalHistorial" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h3>📋 Historial de Intentos</h3>
            <button type="button" class="cerrar-modal">&times;</button>
          </div>
          <div class="history-container" id="historyContainer"></div>
          <div class="modal-footer">
            <button type="button" id="btnLimpiarHistorial" class="btn-outline">
              Limpiar Historial
            </button>
            <button type="button" class="btn-cerrar cerrar-modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./js/script.js"></script>
  </body>
</html>
